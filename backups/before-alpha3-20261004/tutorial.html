  <div class="tutorialStep" data-step="0"><div class="tutorialMedia"><img src="assets/tutorial/tutorial-cover.webp" alt="Prompt Pocket"></div><div class="tutorialMessage"><p>簡単に使い方を説明します。</p></div></div>
