<div class="tutorialPanel">
  <h2 class="tutorialTitle">チュートリアル</h2>
  <div class="tutorialTabs" aria-label="チュートリアルの進行状況">
    <span class="tutorialTab" aria-hidden="true"></span><span class="tutorialTab" aria-hidden="true"></span><span class="tutorialTab" aria-hidden="true"></span><span class="tutorialTab" aria-hidden="true"></span><span class="tutorialTab" aria-hidden="true"></span><span class="tutorialTab" aria-hidden="true"></span><span class="tutorialTab" aria-hidden="true"></span><span class="tutorialTab" aria-hidden="true"></span><span class="tutorialTab" aria-hidden="true"></span>
  </div>
  <div class="tutorialStep" data-step="0"><div class="tutorialMedia"><img src="assets/tutorial/tutorial-cover.png" alt="Prompt Pocket"></div><div class="tutorialMessage"><p>簡単に使い方を説明します。</p></div></div>
  <div class="tutorialStep" data-step="1" hidden><div class="tutorialMedia"><img src="assets/tutorial/step-01-copy-prompt.png" alt="プロンプトをコピー"><span class="tutorialSelectionHandle selectionStart" aria-hidden="true"></span><span class="tutorialSelectionHandle selectionEnd" aria-hidden="true"></span><img class="tutorialPointer pointerCopyPrompt" src="assets/tutorial/tutorial-pointer.png" alt=""></div><div class="tutorialMessage"><p>まずは、公開されているプロンプトをコピーしましょう。</p></div></div>
  <div class="tutorialStep" data-step="2" hidden><div class="tutorialMedia"><img src="assets/tutorial/step-02-add-clean.png" alt="追加ボタンを長押し"><img class="tutorialPointer pointerAdd" src="assets/tutorial/tutorial-pointer.png" alt=""></div><div class="tutorialMessage"><p><b>［＋追加］</b>を長押しします。</p></div></div>
  <div class="tutorialStep" data-step="3" hidden><div class="tutorialMedia"><img src="assets/tutorial/step-03-prompt-input-clean.png" alt="プロンプト名と入力欄"><img class="tutorialPointer pointerPromptInput" src="assets/tutorial/tutorial-pointer.png" alt=""></div><div class="tutorialMessage"><p>プロンプト入力欄に自動的に貼り付けられます。自由に編集し、このプロンプトの名前も入力します。</p></div></div>
  <div class="tutorialStep" data-step="4" hidden><div class="tutorialMedia"><img src="assets/tutorial/step-04-copy-photo-clean.png" alt="写真をコピー"><img class="tutorialPointer pointerCopyPhoto" src="assets/tutorial/tutorial-pointer.png" alt=""></div><div class="tutorialMessage"><p>次に写真をコピーしてきます。</p></div></div>
  <div class="tutorialStep" data-step="5" hidden><div class="tutorialMedia"><img src="assets/tutorial/step-05-select-image-clean.png" alt="画像を選択"><img class="tutorialPointer pointerSelectImage" src="assets/tutorial/tutorial-pointer.png" alt=""></div><div class="tutorialMessage"><p>長押しすると画像が挿入されます。</p></div></div>
  <div class="tutorialStep" data-step="6" hidden><div class="tutorialMedia"><img src="assets/tutorial/step-06-save-clean.png" alt="詳細設定と保存"><img class="tutorialPointer pointerSave" src="assets/tutorial/tutorial-pointer.png" alt=""></div><div class="tutorialMessage"><p>必要な場合は詳細設定をクリックして設定します。設定が終わりましたら、保存をして終了です。</p></div></div>
  <div class="tutorialStep" data-step="7" hidden><div class="tutorialMedia"><img src="assets/tutorial/step-07-card-added.png" alt="追加されたプロンプトカード"></div><div class="tutorialMessage"><p>メイン画面にプロンプトがカードとして追加されます。</p></div></div>
  <div class="tutorialStep" data-step="8" hidden><div class="tutorialMedia tutorialFinalIcon" aria-hidden="true">💡</div><div class="tutorialMessage"><p>詳しい使い方はヘルプをご覧ください。</p></div></div>
  <div class="tutorialActions"><button type="button" class="ghost tutorialClose">閉じる</button><button type="button" class="ghost tutorialBack">戻る</button><button type="button" class="primary tutorialNext">次へ</button></div>
</div>
