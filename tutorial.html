<div class="tutorialPanel">
  <div class="tutorialStep" data-step="0">
    <img class="tutorialCover" src="assets/tutorial/tutorial-cover.png" alt="Prompt Pocket">
    <h2>チュートリアル</h2>
    <p>簡単に使い方を説明します。</p>
  </div>
  <div class="tutorialStep" data-step="1" hidden>
    <img class="tutorialImage" src="assets/tutorial/photo-copy.png" alt="写真をコピーする画面">
    <p>まずは、公開されているプロンプトをコピーしましょう。</p>
  </div>
  <div class="tutorialStep" data-step="2" hidden>
    <img class="tutorialImage" src="assets/tutorial/image-select.png" alt="画像を選択する画面">
    <p>長押しすると画像が挿入されます。</p>
  </div>
  <div class="tutorialStep" data-step="3" hidden>
    <img class="tutorialImage" src="assets/tutorial/card-view.png" alt="メイン画面のカード">
    <p>メイン画面にプロンプトがカードとして追加されます。</p>
  </div>
  <div class="tutorialStep" data-step="4" hidden>
    <img class="tutorialImage" src="assets/tutorial/save-settings.png" alt="詳細設定と保存ボタン">
    <p>必要な場合は詳細設定をクリックして設定します。<br>設定が終わりましたら、保存をして終了です。</p>
  </div>
  <div class="tutorialStep" data-step="5" hidden>
    <div class="welcomeIcon">💡</div>
    <p>詳しい使い方はヘルプをご覧ください。</p>
  </div>
  <div class="tutorialActions">
    <button type="button" class="ghost tutorialClose">閉じる</button>
    <button type="button" class="ghost tutorialBack" hidden>戻る</button>
    <button type="button" class="primary tutorialNext">次へ</button>
  </div>
</div>
